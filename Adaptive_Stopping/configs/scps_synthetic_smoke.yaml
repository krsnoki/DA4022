# CPU smoke run: synthetic MCQ items + mock backbone. Tests controller logic only.
# Paper settings: Table 8 and Appendix H.2 of the SCPS paper.
experiment_id: scps_synthetic_mock_smoke
paper_id: openreview.suD1tqogTd
report_status: not reproduced  # synthetic data, says nothing about task quality
calibration_dataset: null       # training-free surrogate, no calibration split used
warmup_questions: 0             # run once and discard before timing

backbone:
  type: mock
  id: mock.mcq.latent_dist
  kwargs: {}

dataset:
  id: synthetic.mcq
  split: synthetic
  num_questions: 256
  seed: 47
  synthetic:
    num_options: 10
    concentration: 0.3
    p_gold_is_mode: 0.5
    steer_range: [0.3, 0.8]
    null_rate: 0.05
    reasoning_words: [2, 40]

run_seed: 13

budget:
  max_rollouts: 16
  max_new_tokens: 192
  decode_token_limit: 3072
  total_token_limit: 30000

methods:
  scps:
    temperature: 0.6
    max_rounds: 10
    actions_per_round: 1
    sample_sizes: [1, 2, 4]
    root_proposal_batch: 16
    distinct_source_target: 12
    answer_class_quota: 8
    horizon: null
    discovery_weight: 1.0
    overlap_penalty: 0.5
    cost_weight: 1.0
    seen_answer_penalty: 1.0
    repeat_penalty: 0.25
  self_consistency:
    temperature: 0.6
  tree_prefix:
    temperature: 0.6
    beam: 2
    branch: 2
    horizon: 64
  semantic_pruning:
    temperature: 0.6
    beam: 2
    branch: 2
    horizon: 64
    semantic_pruning: true
    overlap_threshold: 0.75
  option_topk:
    k: 8
