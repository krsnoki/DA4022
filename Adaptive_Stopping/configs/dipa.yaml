backbone_id: Qwen/Qwen2.5-Math-1.5B-Instruct
dataset_id: HuggingFaceH4/MATH-500
split: test

prompt_template:
  system: "Please reason step by step, and put your final answer within \\boxed{}."
  user: "{problem}"

generation:
  temperature: 0.7
  top_p: 0.8
  repetition_penalty: 1.05
  max_new_tokens: 512

allocation:
  input_proxy: mql
  gen_proxy: mgl
  lambda_mode: dynamic
  lambda_value: 1.0
  min_difficulty: 1.0e-6
  seeds: [42, 43, 44]
  budget_multipliers: [0.5, 1, 2, 4, 8]
