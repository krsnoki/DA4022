# Noise fine-tuning of the SigLIP-base/16-224 image tower with a frozen zero-shot head.
experiment:
  name: siglip224
  output_dir: outputs/jacobian_noise
  seed: 0
  device: auto

backbone:
  id: multimodal.siglip_base_p16_224

data:
  dataset: vision.imagenet1k_256
  num_train: 48000         # streamed subset of ImageNet train
  num_calib: 256           # first 256 images of the stream, reserved for PTQ calibration
  seed: 0
  prompt: "a photo of a {}."

train:
  max_steps: 1500          # ~1 epoch over num_train at batch 32
  batch_size: 32
  grad_accum: 1
  lr: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 100
  grad_clip: 1.0
  precision: bf16
  gradient_checkpointing: false
  log_every: 25
  eval_every: 500
  eval_examples: 1000
  save: true

noise:
  mode: jacobian
  alpha: 0.5
  sigma_min: 0.005
  sigma_max: 10.0
  warmup_steps: 100
  warmup_sigma: 0.1
  update_interval: 100
  collect: last_step
