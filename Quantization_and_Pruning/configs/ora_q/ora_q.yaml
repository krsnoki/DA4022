# ORA-Q. Group sizes from Table 2 / Sec. 4. For operators marked `diagnose`,
# the calibrator and static/dynamic mode come from the role report that the
# diagnosis writes (clip score vs tau, matmul2 input-dependent by architecture).
method: ora_q
bits: {weight: 4, act: 4}
calibration: {dataset_id: vision.nyuv2.calibration, num_images: 16, seed: 0}
tau: 0.15
ops:
  # not diagnosed by the paper: per-tensor percentile, as in the Table 5 base
  qkv:     {g: null, calib: percentile, mode: static}
  fc1:     {g: null, calib: percentile, mode: static}
  # diagnosed
  matmul1: {g: 1, per_head: true, diagnose: true}     # per head and per dim (d = 64)
  fc2:     {g: 64, diagnose: true}
  proj:    {g: 32, diagnose: true}
  conv:    {g: 8, diagnose: true}                      # Sec. 4 says 8, Table 2 says 16
  matmul2: {g: 2, per_head: true, diagnose: true, architectural: input_dependent}   # pairs of source tokens, per head
