    labels_available: true
    prompt_jsonl_sha256: 019b981f7122e39ce58866cf93f4206511c72532cb537bbaf298753a0f128ba7
    notes: Prompt is the raw "prompt" field. Generated code is not executed.

  - id: text.livecodebench.release_v2.test
    name: LiveCodeBench code_generation_lite (release_v2)
    modality: text
    task: code_generation
    source_url: https://huggingface.co/datasets/livecodebench/code_generation_lite
    license: unknown  # dataset card front matter says only "cc" (variant not specified)
    version: 0fe84c3912ea0c4d4a78037083943e8f0c4dd505
    role: benchmark
    split: test
    preprocessing_id: bastion.upstream.lcb.v1989b80+tools/prepare_lcb.py
    seed: 0
    num_examples: 511  # 400 lines of test.jsonl + 111 lines of test2.jsonl
    num_samples: {e1: 64, sweep: 16}
    labels_available: true
    prompt_jsonl_sha256: d79b048df5f3048d46800d06eeb956fc0196e1ddc44b751848be5eb5f1a1be8a
    notes: >-
      Script-only HF repo, which datasets>=4 refuses to load. The prompt cache is rebuilt
