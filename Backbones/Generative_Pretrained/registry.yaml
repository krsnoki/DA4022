# Generative backbone registry entries (fields from Backbones/README_backbones.md).
# Values are taken from the Hugging Face model cards; "unknown" means not verified.

- id: text.qwen3_5_9b.post_trained
  name: Qwen3.5-9B
  modality: multimodal            # causal language model with a vision encoder; used text-only here
  architecture: qwen3_5
  pretraining_regime: mixed       # self-supervised pre-training + post-training (model card: "Pre-training & Post-training")
  objective: "next-token prediction pre-training followed by post-training (details: model card and Qwen3.5 blog)"
  weights_source: huggingface
  weights_uri: https://huggingface.co/Qwen/Qwen3.5-9B
  revision: unpinned              # latest commit seen on the Hub file page: c202236 (short hash); pin the full hash
  license: apache-2.0
  num_parameters: 9B (model card, rounded)
  input_spec:
    max_model_len_used: 16384     # SCPS paper Appendix H.6
    dtype: bfloat16
  preprocessing: tokenizer chat template, enable_thinking=False
  parent_backbone: Qwen/Qwen3.5-9B-Base
  fine_tuning_dataset: unknown
  wrappers: [vllm_causal_lm.VLLMCausalLM, hf_causal_lm.HFCausalLM]
  notes: Used by the SCPS paper. Hub pipeline tag is image-text-to-text; for the HF wrapper you may need model_class AutoModelForImageTextToText.

