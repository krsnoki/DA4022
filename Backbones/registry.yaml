  - id: text.qwen3-4b-dflash-b16.drafter.unknown
    name: Qwen3-4B-DFlash-b16 (DFlash block-diffusion drafter)
    modality: text
    architecture: >-
      DFlashDraftModel (5 Qwen3-style layers, hidden 2560, block_size 16, mask_token_id 151669).
      Conditions on target hidden states from target layers [1, 9, 17, 25, 33]. The checkpoint
      has no embedding or LM head: at run time it uses the target's embed_tokens and lm_head.
    pretraining_regime: unknown
    objective: >-
      Block-diffusion draft model for speculative decoding, trained by z-lab (DFlash,
      arXiv:2602.06036). In one parallel forward pass it predicts distributions for the 15
      masked positions of a 16-token block (the first position is the last verified token). The model card does not state the training objective or data; the card notes
      the drafter is for thinking-mode-disabled use.
    weights_source: huggingface
    weights_uri: https://huggingface.co/z-lab/Qwen3-4B-DFlash-b16
    revision: b74e3a329c4d963783143b1e970d95b002be72bd
    license: mit
    num_parameters: 537427200          # excludes the borrowed target embedding / LM head
    weight_size_bytes: 1074860568      # model.safetensors, bf16
    input_spec:
      tokenizer: Qwen/Qwen3-4B (the target's tokenizer)
      dtype: bfloat16
      block_size: 16
    preprocessing: same prompt/tokenization as the parent target
    parent_backbone: text.qwen3-4b.post_trained.mixed
    fine_tuning_dataset: unknown
    notes: >-
      Loaded with the upstream BASTION vendored dflash/model.py (DFlashDraftModel.from_pretrained),
      so trust_remote_code is not needed. The repo also ships its own remote code (dflash.py,
      modeling_dflash.py), which is not used here.

