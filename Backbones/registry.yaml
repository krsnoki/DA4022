# Backbone registry (source of truth for model metadata; see README_backbones.md).
# Fields follow "Minimum model registry fields". Values were checked against the
# Hugging Face model cards, config.json and safetensors headers of the pinned
# revisions. Anything not stated by an official source is "unknown".
#
# num_parameters: exact count from the safetensors headers of the pinned
# revision (also confirmed by loading the model and summing parameter sizes).

models:
  - id: text.qwen3-4b.post_trained.mixed
    name: Qwen3-4B
    modality: text
    architecture: Qwen3ForCausalLM (decoder-only transformer, 36 layers, hidden 2560, GQA 32 Q / 8 KV heads, tied embeddings)
    pretraining_regime: mixed
    objective: >-
      Causal language model. Model card: "Training Stage: Pretraining & Post-training"
      (base model Qwen/Qwen3-4B-Base). Post-training details are in the Qwen3 Technical
      Report (arXiv:2505.09388) and were not re-verified here.
    weights_source: huggingface
    weights_uri: https://huggingface.co/Qwen/Qwen3-4B
    revision: 1cfa9a7208912126459214e8b04321603b3df60c
    license: apache-2.0
    num_parameters: 4022468096
    weight_size_bytes: 8044936192      # bf16 safetensors, 3 shards (index total_size)
    input_spec:
      tokenizer: Qwen/Qwen3-4B (same revision)
      dtype: bfloat16
      max_position_embeddings: 40960   # config.json; model card: 32,768 native context
    preprocessing: >-
      tokenizer.apply_chat_template(messages, tokenize=False, add_generation_prompt=True,
      enable_thinking=False); EOS <|im_end|> (id 151645)
    parent_backbone: null
    fine_tuning_dataset: null
    card: Generative_Pretrained/qwen3-4b.md
    notes: >-
      Used in non-thinking mode (enable_thinking=False) as the BASTION/DFlash target.
      The DFlash drafters were trained for non-thinking mode, and upstream BASTION
      refuses --enable-thinking for Qwen3-4B/8B.

