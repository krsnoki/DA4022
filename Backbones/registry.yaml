# Backbone registry. Experiments refer to these IDs; loading code reads
# hf_path, revision and dtype from here. Field meanings: README_backbones.md.
# Values were read on 2026-11-25 from the Hugging Face Hub API, the model card,
# config.json and the safetensors header of the pinned revision. Anything not
# stated by an official source is written as `unknown`.

text.deepseek-r1-distill-qwen-1.5b:
  id: text.deepseek-r1-distill-qwen-1.5b
  name: DeepSeek-R1-Distill-Qwen-1.5B
  modality: text
  architecture: >-
    Qwen2ForCausalLM, decoder-only transformer, 28 layers, hidden size 1536,
    MLP 8960, 12 query heads / 2 KV heads (GQA), untied LM head, vocab 151936
  pretraining_regime: mixed
  objective: >-
    Supervised fine-tuning (distillation) of Qwen2.5-Math-1.5B on about 800k
    samples curated with DeepSeek-R1 (model card, section 7). The parent was
    pretrained with next-token prediction and then math-specialised.
  weights_source: huggingface
  weights_uri: https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  hf_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  revision: ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562
  license: mit
  additional_terms: >-
    The model card notes the Qwen-based distills derive from the Qwen-2.5
    series, originally licensed under Apache 2.0.
  num_parameters: 1777088000  # safetensors header; re-counted at load time by HFCausalLMBackbone.count_parameters()
  weight_size_bytes: 3554214621  # model.safetensors, bf16
  dtype: bfloat16
  input_spec:
    max_position_embeddings: 131072  # config.json
    tokenizer_model_max_length: 16384  # tokenizer_config.json
    chat_template: true  # the generation prompt ends in "<｜Assistant｜><think>\n"
  preprocessing: >-
    tokenizer and chat template from the same repository and revision; prompt
    tokenised with add_special_tokens=False because the template adds BOS
  generation_defaults: {do_sample: true, temperature: 0.6, top_p: 0.95}  # generation_config.json
  usage_notes: >-
    Model card: no system prompt; for math, ask to "reason step by step, and put
    your final answer within \boxed{}"; temperature 0.5-0.7.
  parent_backbone: text.qwen2.5-math-1.5b
  fine_tuning_dataset: unknown  # ~800k DeepSeek-R1-curated samples, not released
  fine_tuning_split: unknown
  method: full_finetune
  loader: Backbones.Task_Finetuned.hf_causal_lm.HFCausalLMBackbone
  card: Backbones/Task_Finetuned/deepseek_r1_distill_qwen_1_5b.md
  notes: Backbone for the Step-Tagging Early-Stopping (ST-ES) experiments. Weights are never modified.

text.qwen2.5-math-1.5b:
  id: text.qwen2.5-math-1.5b
  name: Qwen2.5-Math-1.5B
  status: reference_only  # registered as the parent of text.deepseek-r1-distill-qwen-1.5b; not used in experiments
  modality: text
  architecture: Qwen2ForCausalLM, decoder-only transformer (tied embeddings)
  pretraining_regime: mixed
  objective: math-specialised continued pretraining of Qwen2.5-1.5B (see the Qwen2.5-Math model card)
  weights_source: huggingface
  weights_uri: https://huggingface.co/Qwen/Qwen2.5-Math-1.5B
  hf_path: Qwen/Qwen2.5-Math-1.5B
  revision: 4a83ca6e4526a4f2da3aa259ec36c259f66b2ab2
  license: apache-2.0
  num_parameters: 1543714304  # safetensors header (Hub API)
  dtype: bfloat16
  parent_backbone: Qwen/Qwen2.5-1.5B (not registered)
  fine_tuning_dataset: unknown
  notes: Not downloaded or evaluated here.
